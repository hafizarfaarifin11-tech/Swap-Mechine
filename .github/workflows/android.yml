name: Android CI - AI Controller

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AI Controller APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify project archive
        run: |
          test -f project.zip
          unzip -t project.zip

      - name: Extract source project
        run: unzip -q project.zip -d extracted

      - name: Verify project source
        run: |
          test -f extracted/Ai_Controller_Project/settings.gradle
          test -f extracted/Ai_Controller_Project/app/build.gradle
          test -f extracted/Ai_Controller_Project/app/src/main/java/com/fizz/aicontroller/NavigationCueDetector.java
          test -f extracted/Ai_Controller_Project/app/src/main/java/com/fizz/aicontroller/CaptureBotService.java

      - name: Build debug APK
        working-directory: extracted/Ai_Controller_Project
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Controller-Movement-v0.6-debug
          path: extracted/Ai_Controller_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
