
name: Android CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AI Controller APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"

      - name: Check project ZIP
        run: |
          test -f project.zip || {
            echo "ERROR: project.zip tidak ditemukan!"
            exit 1
          }
          unzip -t project.zip

      - name: Extract project
        run: unzip -q project.zip -d extracted

      - name: Verify project
        run: |
          test -f extracted/Ai_Controller_Project/settings.gradle
          test -f extracted/Ai_Controller_Project/app/build.gradle

      - name: Build APK
        working-directory: extracted/Ai_Controller_Project
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ai-Controller-debug-apk
          path: extracted/Ai_Controller_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
